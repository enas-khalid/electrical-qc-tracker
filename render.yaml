services:
  - type: web
    name: electrical-qc-tracker
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DATA_DIR
        value: /var/data
    disk:
      name: qc-tracker-data
      mountPath: /var/data
      sizeGB: 1
